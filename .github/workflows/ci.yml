name: CI - Fast Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Lint & Code Style
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Execute Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

  test:
    name: Unit Testing
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Run All KMP Unit Tests
        run: ./gradlew allTests --no-daemon --stacktrace

  build-apps:
    name: Build Cross-Platform Targets
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Compile Cross-Platform Targets
        run: |
          ./gradlew \
            :app:androidApp:assembleDebug \
            :app:desktopApp:createDistributable \
            :app:webApp:jsBrowserProductionWebpack \
            :app:webApp:wasmJsBrowserProductionWebpack \
            :server:buildFatJar \
            --no-daemon \
            --stacktrace